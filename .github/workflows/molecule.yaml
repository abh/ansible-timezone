---
name: GitHub Action

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: ansible-lint
        uses: ansible/ansible-lint@v26.9.0

  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "debian:bookworm"
          - "debian:trixie"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "rockylinux/rockylinux:9"
          - "fedora:latest"
          - "archlinux:latest"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install molecule
        run: pip install -r requirements.txt
      - name: molecule
        run: molecule test
        env:
          MOLECULE_IMAGE: ${{ matrix.image }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
