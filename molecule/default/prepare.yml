---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install python3 and sudo
      ansible.builtin.raw: |
        if command -v python3 >/dev/null && command -v sudo >/dev/null; then exit 0; fi
        if command -v apt-get >/dev/null; then apt-get update && apt-get install -y python3 sudo
        elif command -v dnf >/dev/null; then dnf install -y python3 sudo
        elif command -v pacman >/dev/null; then pacman -Sy --noconfirm python sudo
        else echo "no supported package manager" >&2; exit 1; fi
      changed_when: false
