---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    expected_timezone: America/New_York
  tasks:
    - name: Read /etc/localtime
      ansible.builtin.stat:
        path: /etc/localtime
      register: localtime

    - name: Check /etc/localtime points at the configured zone
      ansible.builtin.assert:
        that:
          - localtime.stat.islnk
          - localtime.stat.lnk_target is search(expected_timezone ~ '$')
        fail_msg: "/etc/localtime -> {{ localtime.stat.lnk_target | default('not a link') }}"
